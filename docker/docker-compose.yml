# Nodes - Docker Compose Configuration (Production)
#
# DATA PERSISTENCE WARNING:
# Your database is stored in the 'nodes-data' Docker volume.
# This volume persists even when containers are removed/rebuilt.
#
# SAFE COMMANDS:
#   docker-compose down                  ✅ Stops containers, keeps data
#   docker-compose up --build            ✅ Rebuilds image, keeps data
#   docker-compose restart               ✅ Restarts containers, keeps data
#
# DANGEROUS COMMANDS:
#   docker-compose down -v               ❌ DELETES YOUR DATA!
#   docker volume rm nodes-data          ❌ DELETES YOUR DATA!
#   docker system prune --volumes        ❌ DELETES YOUR DATA!
#
# Regular backups recommended! See README for backup/restore commands.

services:
  nodes:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nodes-app
    ports:
      - "8000:8000"
    volumes:
      - nodes-data:/app/data  # Named volume for database persistence
    environment:
      - NODES_DEBUG=false
      - NODES_DATABASE_PATH=/app/data/nodes.db
      - NODES_HOST=0.0.0.0
      - NODES_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  nodes-data:
    name: nodes-data  # Named volume persists between container rebuilds
