# Nodes - Docker Compose Configuration (Development)
#
# This compose file mounts your source code for hot-reload development.
# Code changes are reflected instantly without rebuilding.
#
# DATA PERSISTENCE:
# Uses the same 'nodes-data' volume as production compose file.
# You can safely switch between dev and prod modes - your data persists!
#
# SAFE COMMANDS:
#   docker-compose -f docker/docker-compose.dev.yml down     ✅ Stops containers, keeps data
#   docker-compose -f docker/docker-compose.dev.yml restart  ✅ Restarts containers, keeps data
#
# DANGEROUS COMMANDS:
#   docker-compose -f docker/docker-compose.dev.yml down -v  ❌ DELETES YOUR DATA!

services:
  nodes-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: nodes-dev
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      # Mount source code for hot-reload
      - ../backend:/app/backend
      - ../frontend/src:/app/frontend/src
      - ../frontend/public:/app/frontend/public
      - ../frontend/vite.config.ts:/app/frontend/vite.config.ts
      - ../frontend/tsconfig.json:/app/frontend/tsconfig.json
      - ../frontend/tsconfig.node.json:/app/frontend/tsconfig.node.json
      - ../frontend/index.html:/app/frontend/index.html
      - ../frontend/package.json:/app/frontend/package.json
      - ../frontend/tailwind.config.js:/app/frontend/tailwind.config.js
      - ../frontend/eslint.config.js:/app/frontend/eslint.config.js
      # Persistent data - SAME VOLUME as production!
      - nodes-data:/app/data
      # Exclude node_modules and Python cache (use container versions)
      - /app/frontend/node_modules
      - /app/backend/__pycache__
    environment:
      - NODES_DEBUG=true
      - NODES_DATABASE_PATH=/app/data/nodes.db
      - NODES_HOST=0.0.0.0
      - NODES_PORT=8000
    restart: unless-stopped
    command: >
      sh -c "
        cd /app/frontend && npm run dev &
        cd /app/backend && python -m app.main
      "

volumes:
  nodes-data:
    name: nodes-data  # Named volume persists between container rebuilds
