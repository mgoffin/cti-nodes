<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nodes Extension Settings</title>
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
    }
    h2 {
      margin: 0 0 16px 0;
      font-size: 18px;
      font-weight: 600;
      color: #1f2937;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
    }
    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    button {
      width: 100%;
      padding: 10px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background: #2563eb;
    }
    .status {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
      display: none;
    }
    .status.success {
      background: #d1fae5;
      color: #065f46;
      display: block;
    }
    .status.error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }
    .description {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h2>Nodes Extension</h2>
  <p class="description">Configure the URLs for your Nodes instance</p>

  <label for="apiUrl">API URL:</label>
  <input type="text" id="apiUrl" placeholder="http://localhost:8000">

  <label for="frontendUrl">Frontend URL:</label>
  <input type="text" id="frontendUrl" placeholder="http://localhost:5173">

  <button id="save">Save Settings</button>

  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
